<!DOCTYPE html>
<html lang="en" data-theme="orchid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Luxis — Next-Gen Minecraft Launcher</title>
<style>
/* ============================================================
   LUNACHER — obsidian glass design system
   ============================================================ */
:root{
  --bg:#0f0c16; --bg-2:#171021; --bg-3:#0b0910;
  --accent:#c864ff; --accent-rgb:200,100,255; --accent-2:#7b5cff;
  --text:#f6f2fb; --muted:#9c93ad; --faint:#6d647b;
  --glass:rgba(25,19,36,.58); --glass-2:rgba(28,21,41,.76); --glass-3:rgba(18,14,27,.9);
  --border:rgba(255,255,255,.085); --border-strong:rgba(var(--accent-rgb),.38);
  --ok:#4ade80; --warn:#fbbf24; --danger:#fb7185;
  --radius:18px; --speed:1; --blur:24px; --dim:.42;
  --spring:cubic-bezier(.22,1,.36,1);
  --sidebar:252px; --dock-h:88px;
  --e1:calc(.18s / var(--speed)); --e2:calc(.32s / var(--speed));
  --e3:calc(.52s / var(--speed)); --e4:calc(.78s / var(--speed));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  font-size:14px;letter-spacing:.005em;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(var(--accent-rgb),.22);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--accent-rgb),.42);background-clip:padding-box}
::selection{background:rgba(var(--accent-rgb),.35)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- wallpaper / ambient ---------- */
.app{position:fixed;inset:0;isolation:isolate;overflow:hidden;background:var(--bg)}
.wallpaper{position:absolute;inset:0;z-index:-3;overflow:hidden;background:
  radial-gradient(120% 90% at 85% -10%,rgba(var(--accent-rgb),.16),transparent 55%),
  linear-gradient(160deg,var(--bg-2),var(--bg) 55%,var(--bg-3))}
.wallpaper::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;will-change:transform}
.b1{width:52vw;height:52vw;left:-12vw;top:-18vw;background:rgba(var(--accent-rgb),.55);animation:float1 22s ease-in-out infinite alternate}
.b2{width:38vw;height:38vw;right:-8vw;bottom:-12vw;background:rgba(var(--accent-rgb),.28);animation:float2 28s ease-in-out infinite alternate}
.b3{width:30vw;height:30vw;left:38vw;top:34vh;background:rgba(91,80,255,.22);animation:float3 34s ease-in-out infinite alternate}
.wallpaper[data-wp="aurora"] .blob{filter:blur(120px);opacity:.5}
.wallpaper[data-wp="nebula"]{background:radial-gradient(100% 80% at 50% 0%,rgba(var(--accent-rgb),.2),transparent 60%),#08060d}
.wallpaper[data-wp="nebula"] .b1{background:rgba(236,72,153,.35)}
.wallpaper[data-wp="nebula"] .b2{background:rgba(56,189,248,.22)}
.wallpaper[data-wp="grid"]{background-image:linear-gradient(rgba(var(--accent-rgb),.045) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--accent-rgb),.045) 1px,transparent 1px),linear-gradient(160deg,var(--bg-2),var(--bg));background-size:44px 44px,44px 44px,100% 100%}
.wallpaper[data-wp="grid"] .blob{opacity:.16}
.wallpaper[data-wp="solid"] .blob{display:none}
.wallpaper[data-wp="solid"]::after{background:#000;opacity:var(--dim)}
@keyframes float1{to{transform:translate3d(10vw,8vh,0) scale(1.18)}}
@keyframes float2{to{transform:translate3d(-9vw,-7vh,0) scale(1.12)}}
@keyframes float3{to{transform:translate3d(-7vw,9vh,0) scale(.82)}}

/* ---------- glass primitives ---------- */
.glass{background:var(--glass);backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);border:1px solid var(--border)}
.card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));position:relative;overflow:hidden;transition:transform var(--e2) var(--spring),border-color var(--e2),box-shadow var(--e2),background var(--e2)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(var(--accent-rgb),.13),transparent 65%);transition:opacity var(--e2)}
.card:hover::before{opacity:1}
.card:hover{border-color:var(--border-strong);box-shadow:0 18px 46px -18px rgba(var(--accent-rgb),.28)}
.lift:hover{transform:translateY(-3px)}
.press:active{transform:scale(.97)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid var(--border);font-size:11px;font-weight:650;color:var(--muted);white-space:nowrap}
.chip.accent{color:var(--accent);background:rgba(var(--accent-rgb),.1);border-color:rgba(var(--accent-rgb),.25)}
.chip.ok{color:var(--ok);background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.22)}
.chip.warn{color:var(--warn);background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.22)}
.chip.danger{color:var(--danger);background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.22)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 9px var(--ok);flex:none}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.muted{color:var(--muted)}
.tiny{font-size:11px}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.045);font-size:12.5px;font-weight:650;transition:all var(--e2) var(--spring);white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,rgba(var(--accent-rgb),.95),var(--accent-2));color:#fff;border-color:rgba(255,255,255,.14);box-shadow:0 8px 26px -10px rgba(var(--accent-rgb),.8)}
.btn.primary:hover{box-shadow:0 12px 34px -8px rgba(var(--accent-rgb),.9)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(251,113,133,.28);background:rgba(251,113,133,.07)}
.btn.sm{padding:7px 11px;font-size:11.5px;border-radius:10px}
.btn.icon{width:34px;height:34px;padding:0;border-radius:10px}
.btn.block{width:100%}
.switch{position:relative;width:40px;height:23px;border-radius:99px;background:rgba(255,255,255,.11);border:1px solid var(--border);transition:background var(--e2),border-color var(--e2);flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform var(--e2) var(--spring)}
.switch.on{background:rgba(var(--accent-rgb),.85);border-color:var(--accent)}
.switch.on::after{transform:translateX(17px)}

/* ---------- sidebar ---------- */
.sidebar{position:absolute;left:0;top:0;bottom:0;width:var(--sidebar);z-index:20;display:flex;flex-direction:column;padding:20px 14px 16px;gap:16px;background:var(--glass-2);border-right:1px solid var(--border);border-left:0;border-top:0;border-bottom:0}
.brand{display:flex;align-items:center;gap:11px;padding:2px 10px 0}
.brand-mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(var(--accent-rgb),.95),var(--accent-2));box-shadow:0 6px 20px -6px rgba(var(--accent-rgb),.85);font-weight:900;font-size:17px;color:#fff;flex:none}
.brand-logo{object-fit:cover;border:1px solid rgba(255,255,255,.1)}
.mr-search{display:flex;align-items:center;gap:9px;padding:0 13px;height:42px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid var(--border);margin-bottom:15px;transition:border-color var(--e2),box-shadow var(--e2)}
.mr-search:focus-within{border-color:var(--border-strong);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.08)}
.mr-search svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2;flex:none}
.mr-search input{flex:1;background:none;border:0;outline:none;font-size:13px;min-width:0}
.mr-search input::placeholder{color:var(--faint)}
.mr-search .chip{flex:none}
.live-icon{width:44px;height:44px;border-radius:11px;object-fit:cover;background:rgba(255,255,255,.06);border:1px solid var(--border)}
.mr-toolbar{display:flex;align-items:center;gap:8px;margin-left:auto}
.code-box{font-size:30px;font-weight:850;letter-spacing:.2em;text-align:center;padding:18px;border-radius:14px;background:rgba(var(--accent-rgb),.09);border:1px solid var(--border-strong);font-family:ui-monospace,monospace}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.02em}
.edition-switch{display:flex;gap:2px;margin-left:auto;padding:3px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--border);flex:none}
.edition-switch button{padding:5px 8px;border-radius:7px;font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--faint);transition:all var(--e2)}
.edition-switch button.on{background:rgba(var(--accent-rgb),.2);color:var(--text)}
.bedrock-card{padding:30px;min-height:236px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(120deg,rgba(56,189,248,.16),transparent 60%),var(--glass)}
.bedrock-card h1{font-size:34px;font-weight:850;letter-spacing:-.045em}
.bedrock-card h1 em{font-style:normal;color:#38bdf8}
.bedrock-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.brand-sub{font-size:9.5px;color:var(--faint);letter-spacing:.15em;text-transform:uppercase;font-weight:700}
.account-pill{display:flex;align-items:center;gap:10px;width:100%;padding:9px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--border);text-align:left;transition:all var(--e2) var(--spring)}
.account-pill:hover{background:rgba(var(--accent-rgb),.09);border-color:var(--border-strong);transform:translateY(-2px)}
.player-head{width:34px;height:34px;border-radius:10px;image-rendering:pixelated;object-fit:cover;background:rgba(255,255,255,.06);border:1px solid var(--border);flex:none}
.acct-meta{flex:1;min-width:0}
.acct-name{font-size:12.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct-type{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px}
.nav{position:relative;display:flex;flex-direction:column;gap:3px;margin-top:4px}
.nav-indicator{position:absolute;left:0;width:3px;height:34px;border-radius:0 4px 4px 0;background:var(--accent);box-shadow:0 0 14px var(--accent);transform:translateY(0);transition:transform var(--e3) var(--spring);z-index:2;top:0}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:11px;color:var(--muted);font-size:13px;font-weight:620;transition:all var(--e2) var(--spring);text-align:left;width:100%}
.nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.045);transform:translateX(2px)}
.nav-item.active{color:var(--text);background:linear-gradient(90deg,rgba(var(--accent-rgb),.15),transparent)}
.nav-item.active svg{color:var(--accent);filter:drop-shadow(0 0 6px rgba(var(--accent-rgb),.6))}
.nav-item .nav-count{margin-left:auto;font-size:10px;color:var(--faint);background:rgba(255,255,255,.05);padding:2px 6px;border-radius:6px}
.sidebar-spacer{flex:1}
.sys-card{padding:12px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border);display:flex;flex-direction:column;gap:9px}
.sys-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}
.sys-row b{color:var(--text);font-weight:700}
.sys-meter{height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.sys-meter i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.side-quick{display:flex;gap:7px}
.side-quick .btn{flex:1;font-size:11px;padding:8px 6px}

/* ---------- main ---------- */
.main{position:absolute;left:var(--sidebar);top:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:10}
.topbar{height:62px;flex:none;display:flex;align-items:center;gap:14px;padding:0 28px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(10,8,16,.5),transparent)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650}
.crumb span:last-child{color:var(--accent)}
.crumb .sep{color:var(--faint)}
.top-search{margin-left:auto;position:relative}
.top-search input{width:220px;padding:9px 12px 9px 34px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--border);outline:none;font-size:12px;transition:all var(--e2)}
.top-search input:focus{width:280px;border-color:var(--border-strong);background:rgba(var(--accent-rgb),.06)}
.top-search svg{position:absolute;left:11px;top:10px;width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:2}
.win-ctrls{display:flex;gap:5px;margin-left:6px}
.win-ctrls button{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--faint);font-size:13px;transition:all var(--e1)}
.win-ctrls button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.viewport{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:26px 28px calc(var(--dock-h) + 34px);opacity:0;transform:translateX(26px) scale(.985);pointer-events:none;transition:opacity var(--e3) var(--spring),transform var(--e3) var(--spring)}
.view.active{opacity:1;transform:none;pointer-events:auto}
.view.leaving{transform:translateX(-26px) scale(.985)}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.view-title{font-size:27px;font-weight:820;letter-spacing:-.035em;line-height:1.15}
.view-title em{font-style:normal;color:var(--accent)}
.view-desc{color:var(--muted);font-size:12.5px;margin-top:5px}
.view-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-bottom:16px}
.hero-main{padding:30px;min-height:236px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(120deg,rgba(var(--accent-rgb),.13),transparent 60%),var(--glass)}
.hero-main h1{font-size:34px;font-weight:850;letter-spacing:-.045em;line-height:1.08}
.hero-main h1 em{font-style:normal;color:var(--accent);text-shadow:0 0 28px rgba(var(--accent-rgb),.45)}
.hero-main p{color:var(--muted);font-size:13px;max-width:430px;margin-top:11px;line-height:1.55}
.hero-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.hero-side{display:flex;flex-direction:column;gap:14px}
.stat-card{padding:17px 19px;flex:1;display:flex;align-items:center;gap:14px}
.stat-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.12);color:var(--accent);font-size:18px}
.stat-v{font-size:21px;font-weight:800;letter-spacing:-.03em}
.stat-l{font-size:11px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 13px}
.section-title{font-size:14px;font-weight:750;letter-spacing:-.01em}
.home-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.home-card{padding:16px}
.home-card h4{font-size:13px;font-weight:750;margin:11px 0 4px}
.home-card p{font-size:11.5px;color:var(--muted);line-height:1.5}
.thumb{height:82px;border-radius:11px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(var(--accent-rgb),.35),rgba(80,60,160,.2));border:1px solid var(--border)}
.thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.15),transparent 45%)}
.thumb span{position:absolute;left:11px;bottom:9px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72);z-index:1}

/* ---------- profiles ---------- */
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:15px}
.profile-card{padding:0;cursor:pointer;animation:cardIn var(--e3) var(--spring) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.profile-banner{height:88px;position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.profile-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.2))}
.profile-icon{position:absolute;left:15px;top:62px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--glass-3);backdrop-filter:blur(10px);border:1px solid var(--border);z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.35);overflow:hidden}
.profile-icon img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.profile-body{padding:38px 16px 15px}
.profile-name{font-size:14.5px;font-weight:780;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.profile-name .active-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px var(--accent)}
.profile-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.profile-foot{display:flex;align-items:center;gap:10px;margin-top:15px;padding-top:13px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.profile-foot .btn{margin-left:auto}

/* ---------- modrinth ---------- */
.tabs{display:flex;gap:5px;padding:4px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid var(--border);width:max-content;margin-bottom:16px}
.tab{padding:9px 17px;border-radius:10px;font-size:12px;font-weight:680;color:var(--muted);transition:all var(--e2) var(--spring);display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--text)}
.tab.active{background:rgba(var(--accent-rgb),.16);color:var(--text);box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.25)}
.tab .badge{font-size:9.5px;background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px}
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-group{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.filter-label{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.filter-chip{padding:6px 11px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.035);font-size:11px;font-weight:620;color:var(--muted);transition:all var(--e2) var(--spring)}
.filter-chip:hover{color:var(--text);transform:translateY(-1px)}
.filter-chip.on{background:rgba(var(--accent-rgb),.15);border-color:rgba(var(--accent-rgb),.4);color:var(--accent)}
.content-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.content-card{padding:0;display:flex;flex-direction:column;animation:cardIn var(--e3) var(--spring) both}
.content-cover{height:96px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(var(--accent-rgb),.28),rgba(24,24,60,.35))}
.content-cover .cov-ico{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;filter:drop-shadow(0 5px 12px rgba(0,0,0,.4))}
.content-cover .cov-badge{position:absolute;top:9px;right:9px}
.content-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.content-title{font-size:13.5px;font-weight:780;display:flex;align-items:center;gap:6px}
.content-desc{font-size:11.5px;color:var(--muted);line-height:1.5;flex:1}
.content-meta{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--faint);flex-wrap:wrap}
.content-foot{display:flex;gap:7px;align-items:center;padding-top:11px;border-top:1px solid var(--border)}
.installed-mark{color:var(--ok);font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}

/* ---------- wardrobe ---------- */
.wardrobe-layout{display:grid;grid-template-columns:minmax(360px,.95fr) minmax(380px,1.05fr);gap:16px;align-items:start}
.preview-panel{padding:18px;position:sticky;top:0}
.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.preview-stage{height:390px;border-radius:16px;position:relative;overflow:hidden;background:radial-gradient(70% 60% at 50% 42%,rgba(var(--accent-rgb),.16),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.035),transparent);border:1px solid var(--border);cursor:grab;touch-action:none}
.preview-stage:active{cursor:grabbing}
.preview-stage::after{content:"";position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:170px;height:18px;border-radius:50%;background:rgba(0,0,0,.32);filter:blur(11px)}
#skinCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.preview-hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:10px;color:var(--faint);z-index:2;pointer-events:none}
.view-toggle{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:4px}
.view-toggle button{padding:5px 9px;border-radius:8px;background:rgba(10,8,16,.6);border:1px solid var(--border);font-size:10px;font-weight:700;color:var(--muted);backdrop-filter:blur(8px)}
.view-toggle button.on{color:var(--accent);border-color:var(--border-strong)}
.layer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.layer-pill{display:flex;align-items:center;justify-content:space-between;gap:5px;padding:7px 9px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.03);font-size:10.5px;color:var(--muted);transition:all var(--e2)}
.layer-pill.on{color:var(--text);border-color:rgba(var(--accent-rgb),.3);background:rgba(var(--accent-rgb),.08)}
.layer-pill .switch{width:27px;height:16px}
.layer-pill .switch::after{width:12px;height:12px;top:1px;left:2px}
.layer-pill .switch.on::after{transform:translateX(11px)}
.preview-controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.side-panel{padding:18px;display:flex;flex-direction:column;gap:18px}
.panel-block h3{font-size:12.5px;font-weight:760;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px}
.skin-card{padding:8px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.03);text-align:center;transition:all var(--e2) var(--spring);position:relative;cursor:pointer}
.skin-card:hover{transform:translateY(-3px);border-color:var(--border-strong)}
.skin-card.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.09);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.25)}
.skin-card canvas{width:52px;height:64px;image-rendering:pixelated;margin:auto;display:block}
.skin-card .sk-name{font-size:10px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.skin-card .sk-fav{position:absolute;top:5px;right:5px;font-size:11px;color:var(--warn)}
.skin-card .sk-actions{display:flex;justify-content:center;gap:4px;margin-top:6px;opacity:0;transition:opacity var(--e2)}
.skin-card:hover .sk-actions{opacity:1}
.skin-card .sk-actions button{width:21px;height:21px;border-radius:6px;background:rgba(255,255,255,.07);font-size:10px;display:grid;place-items:center}
.dropzone{padding:20px;border-radius:13px;border:1.5px dashed rgba(var(--accent-rgb),.35);background:rgba(var(--accent-rgb),.045);text-align:center;transition:all var(--e2);cursor:pointer}
.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:rgba(var(--accent-rgb),.11);transform:scale(1.01)}
.dropzone .dz-ico{font-size:22px;margin-bottom:6px}
.dropzone b{font-size:12px;font-weight:700}
.dropzone p{font-size:10.5px;color:var(--muted);margin-top:4px}
.seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);width:max-content}
.seg button{padding:6px 12px;border-radius:7px;font-size:11px;font-weight:650;color:var(--muted);transition:all var(--e2)}
.seg button.on{background:rgba(var(--accent-rgb),.17);color:var(--text)}
.cape-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:9px}
.cape-card{padding:7px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.03);text-align:center;cursor:pointer;transition:all var(--e2) var(--spring)}
.cape-card:hover{transform:translateY(-3px)}
.cape-card.active{border-color:var(--accent);background:rgba(var(--accent-rgb),.1)}
.cape-swatch{height:66px;border-radius:7px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.cape-swatch::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.16),transparent 40%)}
.cape-card canvas{width:100%;height:66px;display:block;image-rendering:pixelated;border-radius:7px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.25)}
.block-picker{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:8px;max-height:190px;overflow:auto;padding:3px}
.block-opt{padding:3px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.035);cursor:pointer;transition:all var(--e2)}
.block-opt:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.block-opt.on{border-color:var(--accent);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.4);background:rgba(var(--accent-rgb),.12)}
.block-opt img{width:100%;aspect-ratio:1;image-rendering:pixelated;display:block;border-radius:4px}
.block-picker-head{display:flex;align-items:center;gap:10px}
.block-picker-head img{width:30px;height:30px;image-rendering:pixelated;border-radius:6px;border:1px solid var(--border)}
.cape-card span{display:block;font-size:9.5px;margin-top:5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- settings ---------- */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;align-items:start}
.set-card{padding:18px}
.set-card h3{font-size:13px;font-weight:760;margin-bottom:4px}
.set-card .sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
.preset{padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.03);cursor:pointer;transition:all var(--e2) var(--spring);text-align:left}
.preset:hover{transform:translateY(-3px)}
.preset.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.3)}
.preset .swatch-row{display:flex;gap:5px;margin-bottom:9px}
.preset .sw{width:20px;height:20px;border-radius:7px;border:1px solid rgba(255,255,255,.16)}
.preset b{font-size:11.5px;font-weight:720;display:block}
.preset small{font-size:9.5px;color:var(--faint)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.field:last-child{border:0}
.field label{font-size:12px;font-weight:620}
.field .hint{font-size:10px;color:var(--faint);margin-top:2px}
.field input[type=color]{width:38px;height:28px;border:1px solid var(--border);border-radius:8px;background:transparent;padding:2px;cursor:pointer}
.field input[type=range]{width:170px;accent-color:var(--accent);cursor:pointer}
.field select{padding:7px 10px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid var(--border);font-size:11.5px;outline:none}
.wall-row{display:flex;gap:8px;flex-wrap:wrap}
.wall-opt{width:74px;height:52px;border-radius:10px;border:1px solid var(--border);cursor:pointer;position:relative;overflow:hidden;transition:all var(--e2)}
.wall-opt:hover{transform:translateY(-2px)}
.wall-opt.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.4)}
.wall-opt span{position:absolute;bottom:3px;left:5px;font-size:8.5px;font-weight:750;color:#fff;text-shadow:0 1px 4px #000}
.sec-card{padding:14px;display:flex;align-items:center;gap:12px;border-radius:13px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:8px}
.sec-card .player-head{width:38px;height:38px}
.sec-card .acct-meta{flex:1}

/* ---------- dock ---------- */
.dock{position:absolute;left:calc(var(--sidebar) + 28px);right:28px;bottom:18px;height:var(--dock-h);z-index:15;border-radius:20px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--glass-3);box-shadow:0 20px 60px -24px rgba(0,0,0,.75)}
.dock-profile{display:flex;align-items:center;gap:11px;min-width:190px}
.dock-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;border:1px solid var(--border)}
.dock-info b{font-size:12.5px;font-weight:740;display:block}
.dock-info span{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:3px}
.dock-mid{flex:1;display:flex;align-items:center;gap:14px;justify-content:center}
.dock-acct{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
.dock-acct .player-head{width:25px;height:25px;border-radius:7px}
.dock-acct span{font-size:11px;font-weight:650}
.launch-wrap{position:relative;min-width:210px}
.launch-btn{position:relative;width:100%;height:54px;border-radius:15px;overflow:hidden;background:linear-gradient(135deg,rgba(var(--accent-rgb),.97),var(--accent-2));color:#fff;font-size:15px;font-weight:850;letter-spacing:.1em;box-shadow:0 10px 34px -10px rgba(var(--accent-rgb),.9),inset 0 1px 0 rgba(255,255,255,.3);transition:transform var(--e2) var(--spring),box-shadow var(--e2)}
.launch-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.28) 45%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
.launch-btn:hover:not(:disabled){transform:translateY(-2px) scale(1.015)}
.launch-btn:active:not(:disabled){transform:scale(.97)}
.launch-btn:disabled{filter:saturate(.55) brightness(.85)}
.launch-btn.stop{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 10px 34px -10px rgba(239,68,68,.8)}
.launch-progress{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.9);width:0;transition:width .3s linear;box-shadow:0 0 12px #fff}
.launch-label{position:relative;z-index:1}
.dock-status{position:absolute;left:17px;bottom:6px;font-size:9.5px;color:var(--faint);width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity var(--e2)}
.dock-status.show{opacity:1}

/* ---------- overlays: popover / modal / drawer / toast ---------- */
.overlay-root{position:fixed;inset:0;z-index:60;pointer-events:none}
.popover{position:absolute;pointer-events:auto;width:326px;padding:10px;border-radius:17px;background:var(--glass-3);border:1px solid var(--border);backdrop-filter:blur(26px);box-shadow:0 30px 80px -20px rgba(0,0,0,.8);transform-origin:top left;animation:popIn var(--e3) var(--spring) both}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(-10px)}to{opacity:1;transform:none}}
.pop-head{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 11px}
.pop-head b{font-size:12.5px;font-weight:760}
.acct-row{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;cursor:pointer;transition:all var(--e2) var(--spring);border:1px solid transparent}
.acct-row:hover{background:rgba(255,255,255,.055);transform:translateX(3px)}
.acct-row.active{background:rgba(var(--accent-rgb),.1);border-color:rgba(var(--accent-rgb),.25)}
.acct-row .player-head{width:36px;height:36px}
.acct-row .meta{flex:1;min-width:0}
.acct-row .meta b{font-size:12px;display:block;font-weight:720}
.acct-row .meta small{font-size:9.5px;color:var(--faint);font-family:ui-monospace,monospace}
.pop-foot{display:flex;gap:6px;padding-top:9px;margin-top:5px;border-top:1px solid var(--border)}
.pop-foot .btn{flex:1;font-size:11px;padding:8px 6px}
.scrim{position:fixed;inset:0;background:rgba(4,3,8,.62);backdrop-filter:blur(5px);pointer-events:auto;animation:fadeIn var(--e2) both;display:grid;place-items:center;padding:24px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(560px,100%);max-height:86vh;overflow:auto;padding:24px;border-radius:22px;background:var(--glass-3);border:1px solid var(--border);box-shadow:0 40px 100px -20px rgba(0,0,0,.85);animation:modalIn var(--e3) var(--spring) both}
.modal.wide{width:min(760px,100%)}
@keyframes modalIn{from{opacity:0;transform:translateY(22px) scale(.965)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.modal-head h2{font-size:19px;font-weight:800;letter-spacing:-.03em}
.modal-head p{font-size:11.5px;color:var(--muted);margin-top:5px}
.modal-body{display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}
.form-field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.form-field input,.form-field select,.form-field textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.045);outline:none;font-size:12.5px}
.form-field input:focus,.form-field select:focus{border-color:var(--border-strong)}
.form-field input[type=range]{padding:0}
.drawer-scrim{position:fixed;inset:0;background:rgba(4,3,8,.5);pointer-events:auto;animation:fadeIn var(--e2)}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(520px,100%);background:var(--glass-3);border-left:1px solid var(--border);backdrop-filter:blur(30px);padding:24px;overflow-y:auto;animation:drawerIn var(--e3) var(--spring) both}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-hero{height:120px;border-radius:16px;position:relative;overflow:hidden;margin-bottom:14px}
.drawer-hero .d-icon{position:absolute;left:18px;bottom:-14px;width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:var(--glass-3);border:1px solid var(--border)}
.drawer h2{font-size:20px;font-weight:820;letter-spacing:-.03em;margin:18px 0 3px}
.drawer-section{margin-top:22px}
.drawer-section h4{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.mod-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:7px;transition:all var(--e2)}
.mod-row.off{opacity:.5}
.mod-row .m-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:rgba(var(--accent-rgb),.1)}
.mod-row .m-meta{flex:1;min-width:0}
.mod-row .m-meta b{font-size:11.5px;display:block;font-weight:700}
.mod-row .m-meta small{font-size:9.5px;color:var(--faint)}
.luxis-mod-hero{padding:22px;margin-bottom:16px;border-radius:20px;border:1px solid var(--border);background:linear-gradient(135deg,rgba(var(--accent-rgb),.14),rgba(255,255,255,.03));display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.luxis-mod-hero .sub,.luxis-mod-summary{font-size:12px;line-height:1.6;color:var(--muted);margin-top:5px}
.luxis-mod-list .mod-row{min-height:62px;flex-wrap:wrap;transition:none}
.luxis-mod-list .m-meta b{font-size:13px}
.luxis-mod-list .m-meta small{font-size:11px;color:var(--muted)}
.luxis-mod-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.luxis-mod-features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:16px}
.luxis-mod-feature{padding:14px 16px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:13px}
.luxis-mod-feature b{display:block;font-size:13px;margin-bottom:3px}
.luxis-mod-feature small{display:block;font-size:11px;line-height:1.55;color:var(--muted)}
.luxis-mod-filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.folder-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.folder-tile{padding:12px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.03);font-size:11px;font-weight:650;display:flex;align-items:center;gap:8px;transition:all var(--e2)}
.folder-tile:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.progress-ring{transform:rotate(-90deg)}
.progress-ring circle{transition:stroke-dashoffset .25s linear}
.dep-item{display:flex;align-items:center;gap:10px;padding:11px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.03)}
.toast-stack{position:fixed;right:22px;bottom:118px;z-index:90;display:flex;flex-direction:column;gap:9px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;min-width:268px;max-width:360px;padding:12px 14px;border-radius:14px;background:var(--glass-3);border:1px solid var(--border);box-shadow:0 18px 45px -14px rgba(0,0,0,.7);display:flex;align-items:center;gap:11px;backdrop-filter:blur(20px);animation:toastIn var(--e3) var(--spring) both}
.toast.out{animation:toastOut var(--e2) var(--spring) both}
@keyframes toastIn{from{opacity:0;transform:translateX(50px) scale(.94)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(40px) scale(.95)}}
.toast .t-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.14);font-size:14px;flex:none}
.toast b{font-size:11.5px;font-weight:730;display:block}
.toast small{font-size:10px;color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--faint);font-size:12px}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.ribbon{position:absolute;top:0;right:0;padding:5px 9px;border-radius:0 0 0 10px;background:rgba(var(--accent-rgb),.24);font-size:9px;font-weight:800;letter-spacing:.08em}

/* ---------- responsive ---------- */
@media(max-width:1180px){.hero{grid-template-columns:1fr}.home-grid{grid-template-columns:repeat(2,1fr)}.wardrobe-layout{grid-template-columns:1fr}.preview-panel{position:static}.settings-grid{grid-template-columns:1fr}}
@media(max-width:820px){:root{--sidebar:70px}.brand-name,.brand-sub,.acct-meta,.nav-item span:not(.nav-count),.nav-count,.sys-card,.side-quick{display:none}.sidebar{padding:18px 10px}.nav-item{justify-content:center;padding:11px}.account-pill{justify-content:center}.dock{left:88px;right:12px}.main{left:70px}.dock-mid{display:none}.view{padding:20px 16px 130px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- v2 additions: big icon nav, particles, instance page, launch overlay ---------- */
.particles{position:absolute;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.nav{gap:0;margin-top:2px}
.nav-item{justify-content:flex-start;width:100%;margin:0;border-radius:12px;height:var(--navIcon,54px);padding:0 13px;gap:15px;overflow:visible}
.nav-item svg{width:var(--navIconSize,28px);height:var(--navIconSize,28px)}
.nav-item>span:not(.nav-count){display:block;font-size:13px;font-weight:660}
.nav-count{position:absolute;top:4px;right:6px;font-size:8px;padding:1px 4px;line-height:1.3}
.nav-indicator{height:var(--navIcon,54px)}
.nav-item::after{content:attr(data-tip);position:absolute;left:calc(100% + 16px);top:50%;transform:translateY(-50%) translateX(-10px);opacity:0;pointer-events:none;white-space:nowrap;padding:8px 12px;border-radius:10px;background:var(--glass-3);border:1px solid var(--border-strong);box-shadow:0 14px 32px -12px #000;font-size:11px;font-weight:680;color:var(--text);backdrop-filter:blur(18px);transition:all var(--e2) var(--spring);z-index:90}
.nav-item:hover::after{opacity:1;transform:translateY(-50%) translateX(0)}
.no-tooltips .nav-item::after{display:none}
.skin-lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;align-items:start}
.skin-big{padding:11px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.03);text-align:center;position:relative;transition:all var(--e2) var(--spring);cursor:pointer;overflow:hidden}
.skin-big:hover{transform:translateY(-4px);border-color:var(--border-strong);box-shadow:0 18px 40px -20px rgba(var(--accent-rgb),.5)}
.skin-big.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.35)}
.skin-big canvas{width:100%;height:205px;image-rendering:pixelated;display:block}
.skin-big .nm{font-size:12.5px;font-weight:760;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin-big .sub{font-size:9.5px;color:var(--faint);margin-top:3px}
.skin-big .badge{position:absolute;top:9px;left:9px;font-size:8.5px;letter-spacing:.1em;font-weight:850;background:rgba(var(--accent-rgb),.9);color:#fff;padding:4px 8px;border-radius:99px}
.skin-big .tools{position:absolute;top:9px;right:9px;display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity var(--e2)}
.skin-big:hover .tools{opacity:1}
.skin-big .tools button{width:25px;height:25px;border-radius:7px;background:rgba(10,8,16,.75);border:1px solid var(--border);font-size:11px;color:var(--text);display:grid;place-items:center}
.skin-add{min-height:266px;border:1.5px dashed rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all var(--e2)}
.skin-add:hover{background:rgba(var(--accent-rgb),.11);border-color:var(--accent)}
.skin-add .plus{width:52px;height:52px;border-radius:50%;background:rgba(var(--accent-rgb),.18);display:grid;place-items:center;font-size:28px;color:var(--accent)}
.skin-add b{font-size:12.5px}.skin-add small{font-size:10px;color:var(--muted)}
.particle-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:10px 0 14px}
.particle-preset{padding:10px 6px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.03);text-align:center;cursor:pointer;transition:all var(--e2)}
.particle-preset:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.particle-preset.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.12);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.3)}
.particle-preset .pi{height:34px;display:grid;place-items:center;font-size:20px;color:var(--accent)}
.particle-preset span{font-size:9.5px;font-weight:680;display:block;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cape-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.cape-tabs button{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:11.5px;font-weight:700;color:var(--muted);transition:all var(--e2)}
.cape-tabs button.on{background:rgba(var(--accent-rgb),.16);border-color:var(--border-strong);color:var(--text)}
.cape-toolbar{display:flex;align-items:center;gap:9px;margin-bottom:18px;flex-wrap:wrap}
.cape-toolbar input{flex:1;min-width:220px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--border);outline:none;font-size:12px}
.cape-toolbar input:focus{border-color:var(--border-strong)}
.cape-lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.cape-tile{padding:10px;border-radius:15px;border:1px solid var(--border);background:rgba(255,255,255,.03);transition:all var(--e2) var(--spring);cursor:pointer;position:relative;overflow:hidden}
.cape-tile:hover{transform:translateY(-4px);border-color:var(--border-strong);box-shadow:0 16px 36px -18px rgba(var(--accent-rgb),.5)}
.cape-tile.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(var(--accent-rgb),.35)}
.cape-tile canvas{width:100%;height:190px;display:block;image-rendering:pixelated;border-radius:9px;background:rgba(0,0,0,.25)}
.cape-tile .nm{font-size:12px;font-weight:750;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cape-tile .meta{font-size:9.5px;color:var(--faint);margin-top:3px;display:flex;align-items:center;gap:5px}
.cape-tile .heart{position:absolute;top:16px;right:16px;width:26px;height:26px;border-radius:8px;background:rgba(10,8,16,.7);display:grid;place-items:center;font-size:13px;color:#fff;z-index:2}
.cape-tile .heart.off{color:#777;opacity:.6}
.wardrobe-layout{grid-template-columns:minmax(0,1fr) 236px}
.wardrobe-side{padding:14px;position:sticky;top:0}
.wardrobe-side .preview-stage{height:170px}
.wardrobe-side .cape-grid{grid-template-columns:repeat(2,1fr)}
.wardrobe-side .layer-grid{grid-template-columns:repeat(2,1fr)}
.inst-head{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:20px}
.inst-head button{color:var(--accent);font-weight:750}
.inst-hero{display:flex;align-items:flex-start;gap:18px;margin-bottom:18px;flex-wrap:wrap}
.inst-icon{width:82px;height:82px;border-radius:18px;display:grid;place-items:center;font-size:40px;border:1px solid var(--border);box-shadow:0 16px 40px -16px rgba(var(--accent-rgb),.7);flex:none;overflow:hidden}
.dock-icon img,.inst-icon img,.d-icon img,.profile-icon img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;border-radius:inherit}
.inst-name{font-size:30px;font-weight:850;letter-spacing:-.045em;line-height:1.1}
.inst-badge{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.1em}
.inst-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.inst-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:22px 0}
.stat-tile{padding:15px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--border)}
.stat-tile .lbl{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.stat-tile .val{font-size:16px;font-weight:780;margin-top:7px}
.inst-layout{display:grid;grid-template-columns:minmax(0,1fr) 218px;gap:15px;align-items:start}
.inst-toolbar{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.inst-toolbar input{flex:1;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--border);outline:none;font-size:12px}
.inst-toolbar input:focus{border-color:var(--border-strong)}
.mod-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mod-tile{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.03);transition:all var(--e2) var(--spring);cursor:default}
.mod-tile:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.mod-tile.off{opacity:.48}
.mod-tile .mi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.1);color:var(--accent);font-size:16px;flex:none}
.mod-tile .mt{flex:1;min-width:0}
.mod-tile .mt b{font-size:11.5px;font-weight:720;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod-tile .mt small{font-size:9.5px;color:var(--faint)}
.inst-side{padding:14px;position:sticky;top:0}
.side-group{margin-bottom:18px}
.side-group h4{font-size:9.5px;font-weight:850;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
.side-link{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-size:11.5px;font-weight:660;color:var(--muted);transition:all var(--e2)}
.side-link:hover{background:rgba(var(--accent-rgb),.1);color:var(--text);transform:translateX(3px)}
.side-link.on{background:rgba(var(--accent-rgb),.13);color:var(--text)}
.side-link .cnt{margin-left:auto;font-size:9.5px;color:var(--faint)}
.launch-overlay{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:rgba(4,3,9,.74);backdrop-filter:blur(12px);animation:fadeIn var(--e2)}
.launch-panel{width:min(520px,92vw);padding:30px;border-radius:24px;background:var(--glass-3);border:1px solid var(--border);box-shadow:0 40px 100px -20px #000;text-align:center;animation:modalIn var(--e3) var(--spring)}
.launch-panel h2{font-size:19px;font-weight:820;letter-spacing:-.03em}
.launch-panel .sub{font-size:11.5px;color:var(--muted);margin-top:5px}
.ring{width:104px;height:104px;margin:20px auto;display:block}
.ring-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:8}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;filter:drop-shadow(0 0 7px var(--accent));transition:stroke-dashoffset .3s linear}
.ring-label{font-size:17px;font-weight:850;fill:var(--text)}
.stage-list{display:flex;flex-direction:column;gap:6px;text-align:left;margin-top:16px}
.stage-row{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--faint);padding:5px 8px;border-radius:8px;transition:all var(--e2)}
.stage-row.active{color:var(--text);background:rgba(var(--accent-rgb),.1)}
.stage-row.done{color:var(--ok)}
.code-copy{cursor:pointer;user-select:all;border-bottom:1px dashed var(--accent) !important}
.view.drag-target::after{content:"Drop .jar files to install into mods/";position:absolute;inset:12px;z-index:30;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:18px;background:rgba(10,8,18,.82);backdrop-filter:blur(6px);font-size:15px;font-weight:800;color:var(--accent);pointer-events:none}
.settings-modal .modal-head{margin-bottom:12px}
.pms{display:grid;grid-template-columns:184px 1fr;min-height:430px}
.pms-side{padding:10px;border-right:1px solid var(--border);background:rgba(0,0,0,.12)}
.pms-tab{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:660;transition:all var(--e2);text-align:left}
.pms-tab:hover{background:rgba(255,255,255,.05);color:var(--text)}
.pms-tab.on{background:rgba(var(--accent-rgb),.16);color:var(--text)}
.pms-body{padding:18px 20px;overflow-y:auto;max-height:62vh}
.pms-body h3{font-size:13px;font-weight:760;margin:0 0 14px}
.pms-body .hint{font-size:10px;color:var(--faint);margin-top:4px}
.pms-foot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
.acct-choice{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}
.acct-choice button{padding:8px 11px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:11px;font-weight:650;color:var(--muted);transition:all var(--e2)}
.acct-choice button.on{border-color:var(--accent);background:rgba(var(--accent-rgb),.12);color:var(--text)}
</style>
</head>

  th.navIcon=th.navIcon??52;th.navIconSize=th.navIconSize??28;th.particles=th.particles??42;

  th.glow=th.glow??1;th.tooltips=th.tooltips??true;

  const sig=JSON.stringify([th.preset,t.bg,t.bg2,t.text,t.muted,t.accent,t.accent2,th.custom,accent,accent2,th.radius,th.speed,th.blur,th.dim,th.navIcon,th.navIconSize,th.tooltips,th.glass,th.wallpaper,th.reduce,th.glow]);

  root.setProperty('--bg',t.bg);root.setProperty('--bg-2',t.bg2);root.setProperty('--bg-3',t.bg);
  root.setProperty('--accent',accent);root.setProperty('--accent-2',accent2);root.setProperty('--accent-rgb',hexRgb(accent));

let particleRAF=null;
function startParticles(){
  const cv=$('#particles');if(!cv)return;
  const n=Math.min(state.theme.particles||0,30),mode=state.theme.particleStyle||'aurora';
  if(mode==='plain'||!n||state.theme.reduce){cv.width=cv.height=0;if(particleRAF)cancelAnimationFrame(particleRAF);particleRAF=null;return}
  const dpr=Math.min(devicePixelRatio||1,1),w=innerWidth,h=innerHeight;
  cv.width=w*dpr;cv.height=h*dpr;
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  const rgb=getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb').trim()||'200,100,255';
  const glow=state.theme.glow, A=a=>Math.max(0,Math.min(1,a*glow)), col=(a,c)=>`rgba(${c||rgb},${A(a)})`;
  const pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.7+.5,sp:Math.random()*.22+.05,ph:Math.random()*6.28}));
  const cols=Array.from({length:Math.max(8,Math.floor(w/18))},()=>({y:Math.random()*h,sp:.6+Math.random()*1.6,chars:Array.from({length:18},()=>String.fromCharCode(0x30A0+Math.floor(Math.random()*90)))}));
  let tick=0,lastFrame=0;
  const draw=ts=>{
    if(document.hidden||ts-lastFrame<50){particleRAF=requestAnimationFrame(draw);return}
    lastFrame=ts;
    tick++;ctx.clearRect(0,0,w,h);
    if(mode==='aurora'||mode==='particles'){
      for(const p of pts){
        p.y-=p.sp*(mode==='particles'?1.6:1);p.ph+=.01;if(p.y<-6){p.y=h+6;p.x=Math.random()*w}
        const a=(.18+.22*Math.sin(p.ph))*(mode==='particles'?1.1:1);
        ctx.fillStyle=col(a);ctx.beginPath();ctx.arc(p.x+Math.sin(p.ph)*8,p.y,p.r,0,6.28);ctx.fill();
      }
    }else if(mode==='matrix'){
      ctx.font='13px monospace';
      cols.forEach((c,i)=>{c.y+=c.sp;if(c.y>h+240){c.y=-Math.random()*300;c.chars=Array.from({length:18},()=>String.fromCharCode(0x30A0+Math.floor(Math.random()*90)))}
        c.chars.forEach((ch,j)=>{const y=c.y-j*17;if(y<0||y>h)return;ctx.fillStyle=col(j===0?.55:.22*(1-j/18),'80,255,160');ctx.fillText(ch,i*18,y)})});
    }else if(mode==='enchantment'){
      const cx=w/2,cy=h/2,R=Math.min(w,h)*.3;
      pts.forEach((p,i)=>{const a=i/pts.length*6.28+tick*.006;const rr=R+Math.sin(p.ph+tick*.02)*18;
        const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.7;
        ctx.fillStyle=col(.25+.3*Math.abs(Math.sin(a*3+tick*.01)));
        ctx.font='14px serif';ctx.fillText(i%2?'ᚠ':'ᛟ',x,y)});
    }else if(mode==='waves'){
      for(let row=0;row<5;row++){
        ctx.beginPath();
        for(let x=0;x<=w;x+=12){const y=h*(row+1)/6+Math.sin(x*.008+tick*.02+row)*18;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}
        ctx.strokeStyle=col(.1+row*.03);ctx.lineWidth=1.5;ctx.stroke();
      }
      pts.forEach(p=>{p.y-=p.sp;if(p.y<0)p.y=h;ctx.fillStyle=col(.22);ctx.fillRect(p.x,p.y,2,2)});
    }else if(mode==='grid'||mode==='retro'){

      ctx.lineWidth=1;
      for(let x=0;x<w;x+=step){ctx.strokeStyle=col(.07);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
      for(let y=0;y<h;y+=step){ctx.strokeStyle=col(.07);ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
      if(mode==='retro')for(let i=0;i<w;i+=step){ctx.strokeStyle=col(.05);ctx.beginPath();ctx.moveTo(w/2,h/2);ctx.lineTo(i,h);ctx.stroke()}
      pts.slice(0,30).forEach((p,i)=>{const x=Math.floor(p.x/step)*step,y=Math.floor(p.y/step)*step;ctx.fillStyle=col(.15+.25*Math.abs(Math.sin(tick*.02+i)));ctx.fillRect(x-2,y-2,4,4)});
    }else if(mode==='voxels'){
      const cx=w/2,cy=h/2,t=tick*.01;
      pts.slice(0,Math.min(n,40)).forEach((p,i)=>{
        const a=i/40*6.28+t,rr=80+(i%5)*32;
        const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr*.6,sz=8+(i%4)*4;
        ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.strokeStyle=col(.12+(i%4)*.06);ctx.lineWidth=2;ctx.strokeRect(-sz/2,-sz/2,sz,sz);ctx.restore();
      });
    }else if(mode==='lightning'){
      ctx.strokeStyle=col(.05);ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(w,h);ctx.stroke();
      if(Math.random()<.04){let x=Math.random()*w,y=0;ctx.beginPath();ctx.moveTo(x,y);
        while(y<h){x+=(Math.random()-.5)*40;y+=Math.random()*40+10;ctx.lineTo(x,y)}
        ctx.strokeStyle=col(.5,'180,220,255');ctx.lineWidth=2;ctx.stroke()}
      pts.slice(0,20).forEach(p=>{ctx.fillStyle=col(.15);ctx.fillRect(p.x,p.y,2,2)});
    }else if(mode==='liquid'){
      pts.slice(0,8).forEach((p,i)=>{
        const x=p.x+Math.sin(tick*.006+i)*40,y=p.y+Math.cos(tick*.005+i)*30,r=40+20*Math.sin(p.ph+tick*.01);
        const g=ctx.createRadialGradient(x,y,0,x,y,Math.abs(r));g.addColorStop(0,col(.12));g.addColorStop(1,col(0));
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,Math.abs(r),0,6.28);ctx.fill();
      });
    }
    particleRAF=requestAnimationFrame(draw);
  };
  if(particleRAF)cancelAnimationFrame(particleRAF);
  particleRAF=requestAnimationFrame(draw);
}

/* ---------- image helpers ---------- */
const imgCache=new Map(),headCache=new Map();
function getImg(src,cb){
  if(!src||typeof src!=='string')return cb(null);
  if(imgCache.has(src))return cb(imgCache.get(src));
  const im=new Image();
  im.onload=()=>{imgCache.set(src,im);cb(im)};
  im.onerror=()=>cb(null);
  im.src=src;
}
function makeHead(src,cb){
  if(headCache.has(src))return cb(headCache.get(src));
  getImg(src,im=>{
    if(!im)return cb('');
    const c=document.createElement('canvas');c.width=40;c.height=40;const x=c.getContext('2d');
    x.imageSmoothingEnabled=false;
    x.fillStyle='#1b1725';x.fillRect(0,0,40,40);
    x.drawImage(im,8,8,8,8,0,0,40,40);
    x.globalAlpha=.95;x.drawImage(im,40,0,8,5,0,0,40,25);x.globalAlpha=1;
    const url=c.toDataURL('image/png');headCache.set(src,url);cb(url);
  });
}
function setHead(el,src){if(!el)return;makeHead(src,u=>{if(el.isConnected&&u)el.src=u})}

  }
  const url=`https://api.modrinth.com/v2/search?query=${encodeURIComponent(query||'')}`+
    `&facets=${encodeURIComponent(JSON.stringify(facets))}&limit=24&offset=${offset}&sort=downloads&index=downloads`;
  const res=await fetch(url);

const R={yaw:0,walk:false,auto:false,drag:false,lastX:0,t:0,lastFrame:0,zoom:1};

// Correct 64x64 Minecraft UV layout, used by both cards and the large preview.
function paintCharacter(ctx,im,w,h,opt){
  const slim=!!opt.slim,back=!!opt.back,layers=opt.layers||{},walk=opt.walk||0,cape=opt.cape;
  const px=Math.min((h-8)/40,(w-8)/24),ox=(w-24*px)/2,oy=(h-34*px)/2+3;
  const on=k=>layers[k]!==false;
  const part=(u,dx,dy,dw,dh)=>ctx.drawImage(im,u[0],u[1],u[2],u[3],ox+dx*px,oy+(dy+walk)*px,dw*px,dh*px);
  const aw=slim?3:4;
  // Correct 64x64 UVs, derived from Minecraft's box unwrap (u,v,width,height,depth).
  const U=slim?{
    headF:[8,8,8,8],hatF:[40,8,8,8],headB:[24,8,8,8],hatB:[56,8,8,8],
    bodyF:[20,20,8,12],jacketF:[20,36,8,12],bodyB:[32,20,8,12],jacketB:[32,36,8,12],
    armRF:[44,20,3,12],armLF:[36,52,3,12],sleeveRF:[44,36,3,12],sleeveLF:[52,52,3,12],
    armRB:[51,20,3,12],armLB:[43,52,3,12],sleeveRB:[51,36,3,12],sleeveLB:[59,52,3,12],
    legRF:[4,20,4,12],legLF:[20,52,4,12],pantsRF:[4,36,4,12],pantsLF:[4,52,4,12],
    legRB:[12,20,4,12],legLB:[28,52,4,12],pantsRB:[12,36,4,12],pantsLB:[12,52,4,12]
  }:{
    headF:[8,8,8,8],hatF:[40,8,8,8],headB:[24,8,8,8],hatB:[56,8,8,8],
    bodyF:[20,20,8,12],jacketF:[20,36,8,12],bodyB:[32,20,8,12],jacketB:[32,36,8,12],
    armRF:[44,20,4,12],armLF:[36,52,4,12],sleeveRF:[44,36,4,12],sleeveLF:[52,52,4,12],
    armRB:[52,20,4,12],armLB:[44,52,4,12],sleeveRB:[52,36,4,12],sleeveLB:[60,52,4,12],
    legRF:[4,20,4,12],legLF:[20,52,4,12],pantsRF:[4,36,4,12],pantsLF:[4,52,4,12],
    legRB:[12,20,4,12],legLB:[28,52,4,12],pantsRB:[12,36,4,12],pantsLB:[12,52,4,12]
  };
  // Cape hangs behind the player and is only visible from the back.
  if(cape&&back)ctx.drawImage(cape,ox+3*px,oy+8*px+walk,18*px,27*px);
  if(back){
    // From behind, left and right swap places on screen.
    part(U.legLB,8,20,4,12);part(U.legRB,12,20,4,12);
    if(on('leftPants'))part(U.pantsLB,8,20,4,12);if(on('rightPants'))part(U.pantsRB,12,20,4,12);
    part(U.armLB,4,8,aw,12);part(U.armRB,16,8,aw,12);
    if(on('leftSleeve'))part(U.sleeveLB,4,8,aw,12);if(on('rightSleeve'))part(U.sleeveRB,16,8,aw,12);
    part(U.bodyB,8,8,8,12);if(on('jacket'))part(U.jacketB,8,8,8,12);
    part(U.headB,8,0,8,8);if(on('hat'))part(U.hatB,8,0,8,8);
  }else{
    part(U.legRF,8,20,4,12);part(U.legLF,12,20,4,12);
    if(on('rightPants'))part(U.pantsRF,8,20,4,12);if(on('leftPants'))part(U.pantsLF,12,20,4,12);
    part(U.armRF,4,8,aw,12);part(U.armLF,16,8,aw,12);
    if(on('rightSleeve'))part(U.sleeveRF,4,8,aw,12);if(on('leftSleeve'))part(U.sleeveLF,16,8,aw,12);
    part(U.bodyF,8,8,8,12);if(on('jacket'))part(U.jacketF,8,8,8,12);
    part(U.headF,8,0,8,8);if(on('hat'))part(U.hatF,8,0,8,8);
  }
}
function drawSkinCard(cv,src,slim){
  if(!cv)return;
  const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth||160,h=cv.clientHeight||205;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  getImg(src,im=>{if(im){ctx.imageSmoothingEnabled=false;paintCharacter(ctx,im,w,h,{slim,layers:{}})}});
}

function accountDefaults(acc){
  acc.skins=acc.skins||[];

function syncNativeAccounts(){
  if(!state.demoCleaned){
    const gone=[];
    gone.forEach(a=>{try{native()?.removeNativeAccount?.(a.id)}catch(e){}});
    state.accounts=state.accounts.filter(a=>!gone.includes(a));
    state.profiles.forEach(p=>{if(p.accountId&&!state.accounts.some(a=>a.id===p.accountId))p.accountId=''});
    if(!state.accounts.some(a=>a.id===state.activeAccount))state.activeAccount=state.accounts[0]?.id||'';
    state.demoCleaned=true;
  }
  state.communityCapes=state.communityCapes||[];state.capeFavs=state.capeFavs||{};
  if(!state.presetsCleaned){
    const presetNames=PRESET_SKINS.map(s=>s.name);
    state.accounts.forEach(a=>{
      a.skins=(a.skins||[]).filter(s=>!presetNames.includes(s.name));
      if(a.activeSkin&&!a.skins.some(s=>s.id===a.activeSkin))a.activeSkin=a.skins[0]?.id||'';
    });
    state.presetsCleaned=true;
  }
  if(!native())return;
  let list=[];try{list=JSON.parse(native().listNativeAccounts()||'[]')}catch(e){}
  const activeId=native().activeNativeAccount?.();
  const idMap={};
  if(!list.length){
    state.accounts.forEach(a=>{try{const old=a.id;const r=JSON.parse(native().createOfflineAccount(a.username));a.id=r.id;a.uuid=r.uuid;a.type='offline';a.tokenStatus='n/a';idMap[old]=a.id}catch(e){}});
    state.profiles.forEach(p=>{if(idMap[p.accountId])p.accountId=idMap[p.accountId]});
  }else{
    const old=state.accounts;
    state.accounts=list.map(n=>{
      const prev=old.find(a=>a.uuid===n.uuid||a.id===n.id)||{};
      return accountDefaults({...prev,...n,id:n.id,uuid:n.uuid,type:n.type,username:n.username,tokenStatus:n.tokenStatus});
    });
    if(activeId&&state.accounts.some(a=>a.id===activeId))state.activeAccount=activeId;
  }
  const ids=new Set(state.accounts.map(a=>a.id));
  state.profiles.forEach(p=>{if(p.accountId&&!ids.has(p.accountId))p.accountId=''});
  persist();
}

async function checkMsLogin(){

    }else{
      clearInterval(loginTimer);loginTimer=null;loginFlow=null;
      const expired=r.status==='expired'||/AADSTS7000/.test(r.message||'');
      if(expired&&loginRetries<2){loginRetries++;clearInterval(loginTimer);loginTimer=null;loginFlow=null;toast('Code expired','Getting a fresh sign-in code…','!','warn');return startMsLogin()}
      const tenantIssue=/does not exist in tenant|AADSTS50020|cannot access the application/i.test(r.message||'');
      const msg=tenantIssue?'Your Azure app is set to work/school accounts only. In Azure, change Supported account types to "Personal Microsoft accounts only" (or "any organizational directory and personal"), then use the matching audience below.':expired?'That code expired or was already used. Request a fresh one.':(r.message||'Please try again.');
      const s=$('#loginStatus');if(s)s.textContent=msg;

const FACES=[ // vertex builders in local box space
 ['front',(w,h,d)=>[[-w/2,h/2,d/2],[w/2,h/2,d/2],[w/2,-h/2,d/2],[-w/2,-h/2,d/2]],[0,0,1]],
 ['back',(w,h,d)=>[[w/2,h/2,-d/2],[-w/2,h/2,-d/2],[-w/2,-h/2,-d/2],[w/2,-h/2,-d/2]],[0,0,-1]],
 ['right',(w,h,d)=>[[w/2,h/2,d/2],[w/2,h/2,-d/2],[w/2,-h/2,-d/2],[w/2,-h/2,d/2]],[1,0,0]],
 ['left',(w,h,d)=>[[-w/2,h/2,-d/2],[-w/2,h/2,d/2],[-w/2,-h/2,d/2],[-w/2,-h/2,-d/2]],[-1,0,0]],
 ['top',(w,h,d)=>[[-w/2,h/2,-d/2],[w/2,h/2,-d/2],[w/2,h/2,d/2],[-w/2,h/2,d/2]],[0,1,0]],
 ['bottom',(w,h,d)=>[[-w/2,-h/2,d/2],[w/2,-h/2,d/2],[w/2,-h/2,-d/2],[-w/2,-h/2,-d/2]],[0,-1,0]]
];
function proj(v,cx,cy,scale,yaw,swing,pivotY){
  let {x,y,z}=v;
  if(swing){const dy=y-pivotY,c=Math.cos(swing),s=Math.sin(swing);y=pivotY+dy*c-z*s;z=dy*s+z*c}
  const c=Math.cos(yaw),s=Math.sin(yaw);
  const rx=x*c-z*s,rz=x*s+z*c,depth=72-rz,sc=scale*72/depth;
  return {x:cx+rx*sc,y:cy-y*sc-rz*sc*.16,depth};
}
function texQuad(ctx,im,uv,pts){
  const [sx,sy,sw,sh]=uv,[p0,p1,p2,p3]=pts;
  ctx.save();ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p3.x,p3.y);ctx.closePath();ctx.clip();
  const a=(p1.x-p0.x)/sw,b=(p1.y-p0.y)/sw,c=(p3.x-p0.x)/sh,d=(p3.y-p0.y)/sh;
  ctx.transform(a,b,c,d,p0.x,p0.y);ctx.drawImage(im,sx,sy,sw,sh,0,0,sw,sh);ctx.restore();
}
function drawBox(ctx,im,box,yaw,cx,cy,scale,swing,uvMap,alpha=1){
  const {x,y,z,w,h,d}=box,quads=[];
  FACES.forEach(([name,fn,n])=>{
    const nc=Math.cos(yaw)*n[2]+Math.sin(yaw)*n[0];
    if(name!=='top'&&name!=='bottom'&&nc<-.12)return;
    const uv=uvMap[name];if(!uv)return;
    const pts=fn(w,h,d).map(v=>proj({x:v[0]+x,y:v[1]+y,z:v[2]+z},cx,cy,scale,yaw,swing,box.pivot??y));
    quads.push({pts,uv,depth:pts.reduce((s,p)=>s+p.depth,0)/4});
  });
  quads.sort((a,b)=>b.depth-a.depth);
  ctx.globalAlpha=alpha;quads.forEach(q=>texQuad(ctx,im,q.uv,q.pts));ctx.globalAlpha=1;
}
function shadeQuad(ctx,pts,color){
  ctx.save();ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();
}
function drawCape3D(ctx,im,yaw,cx,cy,scale,t){
  if(!im)return;
  const panels=6,top=7.4,bottom=-13.4;
  const tw=im.naturalWidth||im.width||96,th=im.naturalHeight||im.height||144;
  const wave=Math.sin(t*0.0032)*0.45,flutter=Math.sin(t*0.005+1)*0.2;
  const bend=x=>-3.5-Math.cos((x+5)/10*Math.PI)*0.85;
  for(let i=0;i<panels;i++){
    const x0=-5+i*10/panels,x1=-5+(i+1)*10/panels,z0=bend(x0),z1=bend(x1);
    const f0=x0*.10,f1=x1*.10;
    const pts=[
      proj({x:x1,y:top,z:z1},cx,cy,scale,yaw,0,0),
      proj({x:x0,y:top,z:z0},cx,cy,scale,yaw,0,0),
      proj({x:x0+f0+wave*.3,y:bottom,z:z0-.5+flutter*(i/panels)},cx,cy,scale,yaw,0,0),
      proj({x:x1+f1+wave*.3,y:bottom,z:z1-.5+flutter*((i+1)/panels)},cx,cy,scale,yaw,0,0)
    ];
    texQuad(ctx,im,[i*tw/panels,0,tw/panels,th],pts);
    shadeQuad(ctx,pts,'rgba(0,0,0,'+(0.08+0.12*Math.abs(Math.cos((i+.5)/panels*Math.PI))).toFixed(3)+')');
  }
  const fold=[
    proj({x:5,y:top+.3,z:-2.9},cx,cy,scale,yaw,0,0),
    proj({x:-5,y:top+.3,z:-2.9},cx,cy,scale,yaw,0,0),
    proj({x:-5,y:top-1.1,z:bend(-5)},cx,cy,scale,yaw,0,0),
    proj({x:5,y:top-1.1,z:bend(5)},cx,cy,scale,yaw,0,0)
  ];
  texQuad(ctx,im,[0,0,tw,Math.max(4,th*.08)],fold);
  shadeQuad(ctx,fold,'rgba(0,0,0,.18)');
}
function loopCharacter(ts){
  requestAnimationFrame(loopCharacter);
  const cv=$('#skinCanvas');
  if(UI.view!=='wardrobe'||!cv){R.lastFrame=0;return}
  const dt=R.lastFrame?Math.min(ts-R.lastFrame,50):16;R.lastFrame=ts;R.t+=dt;
  if(R.auto&&!R.drag)R.yaw+=dt*0.00038;
  const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;
  if(!w||!h)return;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.imageSmoothingEnabled=false;
  const a=activeAccount(),src=skinOf(a)?.src;
  getImg(src,im=>{
    if(!im)return;
    equippedCapeImage(a,capeIm=>{
      const scale=Math.min(w/46,h/40)*R.zoom,cx=w/2,cy=h/2+8,yaw=R.yaw;
      const sw=R.walk?Math.sin(R.t*0.006)*.38:0;
      drawCape3D(ctx,capeIm,yaw,cx,cy,scale,R.t);
      const slim=a.model==='slim'||skinOf(a)?.slim,aw=slim?3:4;
      const L=a.skins&&activeAccount().layers;
      const layers=L||{hat:true,jacket:true,rightSleeve:true,leftSleeve:true,rightPants:true,leftPants:true};
      const boxes=[
        {x:0,y:14,z:0,w:8,h:8,d:8,uv:UV.head,pivot:14},
        {x:0,y:2,z:0,w:8,h:12,d:4,uv:UV.body},
        {x:6,y:2,z:0,w:aw,h:12,d:4,uv:UV.rarm,pivot:8,swing:-sw},
        {x:-6,y:2,z:0,w:aw,h:12,d:4,uv:UV.larm,pivot:8,swing:sw},
        {x:2,y:-10,z:0,w:4,h:12,d:4,uv:UV.rleg,pivot:-4,swing:sw},
        {x:-2,y:-10,z:0,w:4,h:12,d:4,uv:UV.lleg,pivot:-4,swing:-sw}
      ];
      const over=[
        {on:layers.hat,b:{x:0,y:14,z:0,w:8.6,h:8.6,d:8.6,uv:UV.hat}},
        {on:layers.jacket,b:{x:0,y:2,z:0,w:8.6,h:12.6,d:4.6,uv:UV.jacket}},
        {on:layers.rightSleeve,b:{x:6,y:2,z:0,w:aw+.6,h:12.6,d:4.6,uv:UV.rsleeve,pivot:8,swing:-sw}},
        {on:layers.leftSleeve,b:{x:-6,y:2,z:0,w:aw+.6,h:12.6,d:4.6,uv:UV.lsleeve,pivot:8,swing:sw}},
        {on:layers.rightPants,b:{x:2,y:-10,z:0,w:4.6,h:12.6,d:4.6,uv:UV.rpants,pivot:-4,swing:sw}},
        {on:layers.leftPants,b:{x:-2,y:-10,z:0,w:4.6,h:12.6,d:4.6,uv:UV.lpants,pivot:-4,swing:-sw}}
      ].filter(o=>o.on);
      const entries=[
        ...boxes.map(b=>({b,depth:72-(b.x*Math.sin(yaw)+b.z*Math.cos(yaw))})),
        ...over.map(o=>({b:o.b,depth:72-(o.b.x*Math.sin(yaw)+o.b.z*Math.cos(yaw))-.05}))
      ].sort((p,q)=>q.depth-p.depth);
      entries.forEach(e=>drawBox(ctx,im,e.b,yaw,cx,cy,scale,e.b.swing||0,e.b.uv));
    });
  });
}

async function importDroppedJars(files,profile){
  const jars=[...files].filter(f=>f.name.toLowerCase().endsWith('.jar'));
  if(!jars.length){toast('Use file picker','Choose .jar files from the dialog','!','warn');ACTIONS.pickMods();return}
  if(!api())return toast('Desktop launcher required','Run Luxis.exe to install files into instance folders','!','warn');
  if(!jars.some(f=>f.path)){toast('Use file picker','WebView2 hides dropped file paths — choose the files instead','!','warn');ACTIONS.pickMods();return}
  try{
    const r=JSON.parse(await api().importJarFiles(JSON.stringify(jars.map(f=>f.path||'').filter(Boolean)),profile.name));
    (r.files||[]).forEach(name=>{
      const id=name.replace(/\.jar$/i,'');
      if(!profile.mods.some(m=>m.id===id))profile.mods.push({id,title:id,file:name,v:'local',on:true});
    });
    persist();renderAll();if(UI.view==='instance')renderInstance();
    if(api())enrichCustomMods(profile);
    toast('Mods installed',`${(r.files||[]).length} file(s) copied to mods/`,'OK','ok');
    if((r.rejected||[]).length)toast('Invalid mod files',r.rejected.join(', ')+' - not a valid .jar','!','warn');
  }catch(e){toast('Import failed',e.message||String(e),'!','warn')}
}

function onNativeMessage(e){
  const d=e.data;if(!d)return;
  if(d.type==='crash'){
    if(d.exitCode===0){const s=$('#dockStatus');if(s)s.textContent='Game closed';resetLaunch();return}
    UI.running=false;UI.runningProfile='';$('#launchBtn')?.classList.remove('stop');
    const el=$('#launchError');const msg='Game exited (code '+d.exitCode+'). '+(d.tail||'').split('\n').slice(-3).join(' ');
    if(el)el.textContent=msg.slice(0,400);
    toast('Game exited',msg.slice(0,120),'!','warn');
    if(d.instance)showDiagnostics(d.instance);
    const l=$('#launchLabel');if(l)l.textContent='CRASHED';
    setTimeout(resetLaunch,4000);return;
  }
  if(d.type==='java'){
    const st=$('#launchStage');if(st)st.textContent=d.stage||'';
    const pct=$('#launchPct');if(pct&&typeof d.progress==='number')pct.textContent=Math.round(d.progress)+'%';
    updateLaunchOverlay(d.stage,d.progress,'');return;
  }
  if(d.type!=='launch')return;
  const l=$('#launchLabel'),s=$('#dockStatus'),p=$('#launchProgress');
  if(l&&d.stage)l.textContent=String(d.stage).toUpperCase();
  if(s&&d.detail!==undefined)s.textContent=d.detail||d.stage||'';
  if(p&&typeof d.progress==='number')p.style.width=Math.max(6,Math.min(100,d.progress))+'%';
  updateLaunchOverlay(d.stage,d.progress,d.detail);
}

/* ---------- content installing ---------- */
function needsDeps(item){
  const p=activeProfile();
  return (item.deps||[]).filter(d=>!p.mods.some(m=>m.id===d));
}
function installNow(item,withDeps){
  const p=activeProfile();
  if(item.type==='mod'){
    if(withDeps)(item.deps||[]).forEach(d=>{if(!p.mods.some(m=>m.id===d))p.mods.push({id:d,on:true,v:latestVersion(catalog(d))})});
    if(p.mods.some(m=>m.id===item.id)){toast('Already installed',item.title,'✓');return}
    p.mods.push({id:item.id,on:true,v:latestVersion(item)});
  }else if(item.type==='pack'){
    if(p.packs.includes(item.id)){toast('Already installed',item.title,'✓');return}
    p.packs.push(item.id);
  }else{
    if(p.shaders.includes(item.id)){toast('Already installed',item.title,'✓');return}
    p.shaders.push(item.id);
  }
  persist();renderAll();
  toast('Installed into '+p.name,item.title+' · '+latestVersion(item),'↓','ok');
}
function latestVersion(item){return item?.versions?.[0]||'1.0.0'}
function installContent(id){
  const item=catalog(id);if(!item)return;
  const p=activeProfile(),missing=needsDeps(item);
  if(item.type==='shader'&&!p.mods.some(m=>m.id==='iris'&&m.on)){
    openModal(`${modalHead('Iris Shaders is required',`${item.title} needs Iris to run in ${p.version}.`) }
     <div class="dep-item"><div class="m-ico" style="font-size:20px;color:#b98cff">✦</div><div style="flex:1"><b style="font-size:12.5px">Iris Shaders</b><div class="tiny muted">Latest compatible: 1.9.2 · Fabric ${p.loaderVersion}</div></div><span class="chip accent">Required</span></div>
     <div class="modal-foot"><button class="btn" data-act="closeOverlay">Cancel</button><button class="btn primary" data-act="installIrisThen" data-id="${id}">Install Iris + shader</button></div>`);
    return;
  }
  if(missing.length){
    openModal(`${modalHead('Resolve dependencies?',`${item.title} requires ${missing.length} shared librar${missing.length>1?'ies':'y'} not present in ${p.name}.`)}
      ${missing.map(d=>{const c=catalog(d);return `<div class="dep-item"><div class="m-ico" style="color:${c?.color}">${c?.icon||'⬡'}</div><div style="flex:1"><b style="font-size:12.5px">${esc(c?.title||d)}</b><div class="tiny muted">v${latestVersion(c)} · auto-matched</div></div><span class="chip accent">Required</span></div>`}).join('')}

/* ---------- actions ---------- */
const bridge=native;
const MOD_PROJECTS={},ENRICHED=new Set();
function normMod(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function normVer(s){const m=String(s||'').match(/(\d+\.\d+(?:\.\d+)?)/);return m?m[1]:normMod(s)}
async function findModProject(m){
  const key=m.id||m.title||'';
  if(MOD_PROJECTS[key]!==undefined)return MOD_PROJECTS[key];
  const raw=(m.title&&m.title!==m.id)?m.title:m.id;
  const first=String(raw||'').replace(/\.jar$/i,'').split(/[-_]/)[0].trim();
  const spaced=first.replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/^([A-Z])([A-Z][a-z])/,'$1 $2');
  if(first.length<3){MOD_PROJECTS[key]=null;return null}
  try{
    const queries=[first,spaced].filter((v,i,a)=>v&&a.indexOf(v)===i),hits=[];
    for(const q of queries){
      const r=JSON.parse(await api().searchModrinth(q.slice(0,60),'mod','All','All','',0));
      hits.push(...(r.hits||[]));
    }
    const a=normMod(raw),qn=normMod(first);
    const score=h=>{
      const s=normMod(h.slug||''),t=normMod(h.title);
      if(s&&s===qn)return 5;
      if(s.length>=3&&a.includes(s))return 4;
      if(t.length>=4&&a.includes(t))return 3;
      if(s.length>=3&&s.includes(qn))return 2;
      if(t.length>=4&&t.includes(a.slice(0,Math.min(a.length,8))))return 1;
      return 0;
    };
    const best=hits.map(h=>({h,s:score(h)})).filter(x=>x.s>0).sort((x,y)=>y.s-x.s)[0];
    const hit=best?.h;
    MOD_PROJECTS[key]=hit?{id:hit.id,title:hit.title,icon:hit.iconUrl}:null;
  }catch(e){MOD_PROJECTS[key]=null}
  return MOD_PROJECTS[key];
}
async function enrichCustomMods(p,force=false){
  if(!api())return;
  let changed=false;
  for(const m of (p.mods||[]).slice(0,40)){
    if(m.icon&&!force)continue;
    const proj=await findModProject(m);
    if(!proj?.icon)continue;
    m.icon=proj.icon;
    if(!m.projectId||m.projectId===m.id)m.projectId=proj.id;
    if(!m.title||m.title===m.id)m.title=proj.title;
    changed=true;
  }
  if(changed){persist();if(UI.view==='instance')renderInstance();else renderAll();toast('Icons resolved','Matched custom mods to Modrinth artwork','OK','ok')}
}
async function updateMods(onlyIds){
  if(!api())return toast('Desktop launcher required','Run Luxis.exe to update mods','!','warn');
  const p=viewedProfile(),candidates=(p.mods||[]).filter(m=>m.id&&m.sha512!=='browser'&&(!onlyIds||onlyIds.includes(m.id)));
  if(!candidates.length)return toast('Nothing to update','No mods found in this instance','i');
  toast('Checking for updates',`${candidates.length} mod(s)…`,'↻');
  const outdated=[];
  for(const m of candidates){
    try{
      let update=false;
      if(m.sha512){const r=JSON.parse(await api().checkModrinthUpdate(m.sha512,m.id));update=!!r.update}
      else{
        const proj=await findModProject(m);
        if(proj){
          const vs=JSON.parse(await api().modrinthVersions(proj.id,p.version,p.loader));
          const newest=vs[0];
          if(newest&&normVer(newest.versionNumber)!==normVer(m.v||m.file||m.id))update=true;
          m.projectId=proj.id;if(!m.icon&&proj.icon)m.icon=proj.icon;
        }
      }
      MOD_UPDATES[m.id]=update;if(update)outdated.push(m);
    }catch(e){}
  }
  if(!outdated.length){if(UI.view==='instance')renderInstance();return toast('All mods up to date',`${candidates.length} checked`,'OK','ok')}
  let done=0;
  for(const m of outdated){
    try{
      const proj=m.projectId||await findModProject(m);
      if(!proj)continue;
      const raw=await api().installModrinth(JSON.stringify({id:proj.id,title:m.title||m.id,projectType:'mod'}),JSON.stringify(p));
      const r=JSON.parse(raw),item=(r.installed||[])[0];
      if(item){
        if(m.file&&m.file!==item.file&&native()?.deleteModFile)native().deleteModFile(p.name,m.file);
        const i=p.mods.indexOf(m);if(i>=0)p.mods[i]={...m,file:item.file,v:item.version,sha512:item.sha512,on:m.on};
        MOD_UPDATES[m.id]=false;done++;
      }
    }catch(e){}
  }
  persist();if(UI.view==='instance')renderInstance();else renderAll();
  toast('Update complete',`${done} of ${outdated.length} mod(s) updated`,'✓','ok');
}

function resolveModFile(p,m){
  if(m.file) return String(m.file).replace(/\.disabled$/i,'');
  const names=JSON.parse(native()?.listModFiles?.(p.name)||'[]');
  const key=(m.title||m.id||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!key)return '';
  const norm=f=>f.toLowerCase().replace(/\.disabled$/i,'').replace(/\.jar$/i,'').replace(/[^a-z0-9]/g,'');
  const hit=names.find(f=>norm(f).startsWith(key))||names.find(f=>norm(f).includes(key));
  return hit?hit.replace(/\.disabled$/i,''):'';
}
