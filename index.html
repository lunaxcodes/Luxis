async function changeLuxisMod(el,action){
  const pr=state.profiles.find(x=>x.id===el.dataset.profile);if(!pr)return;
  const host=api();
  if(!host)return toast('Desktop launcher required','Open Luxis.exe to manage the mod','!','warn');
  if(luxisModBusy)return;
  const removing=action==='remove',updating=action==='update';
  if(UI.launching||(!updating&&UI.running))return toast('Minecraft is running','Close the game before changing Luxis Mod','!','warn');
  el.disabled=true;
  try{
    const raw=removing?await host.removeLuxisMod(pr.name):updating?await host.updateLuxisMod(pr.name,pr.version):await host.installLuxisMod(pr.name,pr.version);
    const r=JSON.parse(raw);
    if(!r.ok)return toast('Luxis Mod could not be changed',r.error||'Unknown error','!','warn');
    if(r.queued){
      if(UI.view==='luxismod')renderLuxisMod();else VIEW_DIRTY.add('luxismod');
      return toast('Luxis Mod update queued','Close Minecraft, then click Play in Luxis to apply it.','↻','ok');
    }
    syncLuxisProfile(pr,removing?null:r);
    persist();
    if(UI.view==='luxismod')renderLuxisMod();else VIEW_DIRTY.add('luxismod');
    toast(`Luxis Mod ${removing?'removed':updating?'updated':'ready'}`,removing?pr.name:`${pr.name} · v${r.version} · ${r.enabled?'relaunch Minecraft':'still disabled'}`,'OK','ok');
  }catch(e){toast('Luxis Mod could not be changed',e.message||String(e),'!','warn')}
  finally{el.disabled=false}
}

async function updateAllLuxisMods(){
  const host=api(),targets=luxisModEntries.filter(([pr,st])=>canUpdateLuxisMod(pr,st));
  if(!host||UI.running||UI.launching||luxisModBusy||!targets.length)return;
  let updated=0,queued=0;
  luxisModBusy=true;drawLuxisModList();
  try{
    for(const [pr] of targets){
      if(UI.running||UI.launching)break;
      try{
        const result=JSON.parse(await host.updateLuxisMod(pr.name,pr.version));
        if(result.queued)queued++;
        else if(result.ok){syncLuxisProfile(pr,result);updated++}
      }catch(e){}
    }
    if(updated)persist();
  }finally{
    luxisModBusy=false;
    if(UI.view==='luxismod')renderLuxisMod();else VIEW_DIRTY.add('luxismod');
  }
  const failed=targets.length-updated-queued;
  toast('Luxis Mod updates',`${updated} updated, ${queued} queued. ${failed?'Open the profile row to retry failed updates.':'Relaunch Minecraft from Luxis to load the new build.'}`,'↻',failed?'warn':'ok');
}

}

 themeRange:el=>{const k=el.dataset.k;state.theme[k]=k==='dim'||k==='glass'?Number(el.value)/100:Number(el.value);persist();applyTheme();const b=el.closest('.field')?.querySelector('.mono');if(b)b.textContent=k==='blur'?state.theme.blur+'px':k==='radius'?state.theme.radius+'px':Math.round(state.theme[k]*100)+'%'},
 themeSelect:el=>{state.theme[el.dataset.k]=Number(el.value);persist();applyTheme()}
};
/* ---------- global event wiring ---------- */
document.addEventListener('click',e=>{
  const acctPill=e.target.closest('#accountPill'),dockAcct=e.target.closest('#dockAccount');
  if(acctPill||dockAcct){const pop=$('.popover');if(pop){closeOverlay();return}openAccountPopover(acctPill||dockAcct);return}
  const nav=e.target.closest('.nav-item');if(nav){navigate(nav.dataset.view);return}
  const el=e.target.closest('[data-act]');
  if(el&&ACTIONS[el.dataset.act]){e.preventDefault();ACTIONS[el.dataset.act](el,e);return}
  // Only a click on the dimmed backdrop (or outside a popover) dismisses an overlay.
  // Clicks anywhere inside a modal must never close it.
  if(e.target.classList&&e.target.classList.contains('scrim')){closeOverlay();return}
  const pop=$('.popover');
  if(pop&&!e.target.closest('.popover'))closeOverlay();
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-act]');if(el&&['themeColor','themeSelect','profileField','acctTab','saveTenant'].includes(el.dataset.act))ACTIONS[el.dataset.act](el)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-act]');if(el&&['themeRange','themeRange2','profileRange'].includes(el.dataset.act))ACTIONS[el.dataset.act](el)});
let hoverRAF=0,hoverCard=null,hoverX=0,hoverY=0;
document.addEventListener('mousemove',e=>{
  const c=e.target.closest('.card');if(!c)return;
  hoverCard=c;hoverX=e.clientX;hoverY=e.clientY;
  if(hoverRAF)return;
  hoverRAF=requestAnimationFrame(()=>{hoverRAF=0;if(!hoverCard||!hoverCard.isConnected)return;const r=hoverCard.getBoundingClientRect();hoverCard.style.setProperty('--mx',(hoverX-r.left)+'px');hoverCard.style.setProperty('--my',(hoverY-r.top)+'px')});
});
let searchTimer=null;
function queueSearch(value){
  state.ui.mrSearch=value;persist();
  clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadModrinth(true),320);
}
$('#globalSearch').addEventListener('input',e=>{queueSearch(e.target.value);if(UI.view==='modrinth'){const mr=$('#mrSearch');if(mr)mr.value=e.target.value}});
$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){navigate('modrinth');loadModrinth(true)}});
let rebuildTimer=null;
function rebuildSearch(fn,id){
  clearTimeout(rebuildTimer);
  rebuildTimer=setTimeout(()=>{const old=$(id),caret=old?.selectionStart;fn();const el=$(id);if(el){el.focus();if(caret!=null)el.setSelectionRange(caret,caret)}},90);
}
document.addEventListener('input',e=>{if(e.target.id==='mrSearch'){$('#globalSearch').value=e.target.value;queueSearch(e.target.value)}
if(e.target.id==='capeSearch'){CAPE_SEARCH=e.target.value;rebuildSearch(renderCapes,'#capeSearch')}
if(e.target.id==='skinSearch'){WARDROBE.search=e.target.value;rebuildSearch(renderWardrobe,'#skinSearch')}
if(e.target.id==='instSearch'){UI.instSearch=e.target.value;rebuildSearch(renderInstance,'#instSearch')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});

/* skin upload + conversion */
function importSkinFile(file){
  if(!file||!file.name.toLowerCase().endsWith('.png'))return toast('Invalid file','Please choose a .png skin file','⚠','warn');
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      let src;
      if(im.width===64&&im.height===64)src=im.src;
      else{
        const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');x.imageSmoothingEnabled=false;
        x.drawImage(im,0,0,Math.min(im.width,64),Math.min(im.height,32),0,0,Math.min(im.width,64),Math.min(im.height,32));
        if(im.height===32)x.drawImage(im,4,16,8,16,4,48,8,16);
        src=c.toDataURL('image/png');
      }
      const a=activeAccount(),s={id:uid('s'),name:file.name.replace(/\.png$/i,'').slice(0,24)||'Imported skin',src,slim:a.model==='slim',fav:false};
      a.skins.push(s);a.activeSkin=s.id;persist();renderWardrobe();renderHeaderState();refreshHeads();
      toast('Skin imported',s.name+(im.height===32?' · legacy 64×32 converted':''),'↓','ok');
    };
    im.onerror=()=>toast('Unreadable image','Skin file could not be decoded','⚠','warn');
    im.src=r.result;
  };
  r.readAsDataURL(file);
}
$('#skinFileInput').addEventListener('change',e=>{importSkinFile(e.target.files[0]);e.target.value=''});
$('#capeFileInput').addEventListener('change',e=>{uploadCape(e.target.files[0]);e.target.value=''});
document.addEventListener('dragover',e=>{const d=e.target.closest('.dropzone');if(d){e.preventDefault();d.classList.add('drag')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest('.dropzone');if(d)d.classList.remove('drag')});
document.addEventListener('dragover',e=>{
  const view=e.target.closest('#view-instance');
  if(view&&e.dataTransfer.types.includes('Files')){e.preventDefault();view.classList.add('drag-target')}
});
document.addEventListener('dragleave',e=>{
  const view=e.target.closest('#view-instance');if(view&&!view.contains(e.relatedTarget))view.classList.remove('drag-target');
});
document.addEventListener('drop',e=>{
  const view=e.target.closest('#view-instance');
  if(view){e.preventDefault();view.classList.remove('drag-target');importDroppedJars(e.dataTransfer.files,viewedProfile());return}
  const d=e.target.closest('.dropzone');if(!d)return;e.preventDefault();d.classList.remove('drag');
  const f=e.dataTransfer.files[0];
  if(d.id==='skinDrop'||e.target.closest('#skinDrop'))importSkinFile(f);
  else if(d.dataset.jarDrop){const p=state.profiles.find(x=>x.id===d.dataset.jarDrop);if(p&&f)importDroppedJars([f],p)}
});
/* jar picker via hidden input */
$('#jarFileInput').addEventListener('change',e=>{const f=e.target.files[0];const p=activeProfile();if(f&&p){p.mods.push({id:f.name.replace(/\.jar$/i,''),on:true,v:'local'});persist();renderAll();if(api())enrichCustomMods(p);toast('Mod imported',f.name,'↓','ok')}e.target.value=''});
/* modpack import */
$('#mrpackInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),src=j.profile||j;
      const p={id:uid('p'),name:src.name||'Imported modpack',icon:src.icon||'⬡',banner:src.banner||'linear-gradient(135deg,#0d9488,#38bdf8)',version:src.version||'26.3',loader:src.loader||'fabric',loaderVersion:src.loaderVersion||'0.19.5',ram:src.ram||6,jvm:src.jvm||'default',res:src.res||'1920x1080',accountId:'',mods:src.mods||[],packs:src.packs||[],shaders:src.shaders||[],created:'imported'};
      state.profiles.push(p);state.activeProfile=p.id;persist();renderAll();toast('Modpack imported',p.name+' · '+p.mods.length+' mods','⇪','ok');
    }catch(err){toast('Import failed','File is not a compatible .mrpack prototype','⚠','warn')}
  };
  r.readAsText(f);e.target.value='';
});
$('.topbar').addEventListener('pointerdown',e=>{
  if(e.target.closest('button,input'))return;
  bridge()?.drag?.();
});
$('#launchBtn').addEventListener('click',()=>UI.running?doStop():doLaunch());
$('#quickWardrobe').addEventListener('click',()=>navigate('wardrobe'));
$('#quickTheme').addEventListener('click',()=>navigate('settings'));

/* ---------- boot ---------- */
syncNativeAccounts();
refreshNavOffsets();window.addEventListener('resize',refreshNavOffsets);
persist();
renderAll();
refreshMojangCapes().then(()=>{if(UI.view==='capes'||UI.view==='wardrobe')renderView(UI.view)});
refreshBedrock().then(()=>{if(UI.view==='home')renderHome()});
const navItems=$$('.nav-item'),cur=navItems.findIndex(x=>x.dataset.view===UI.view);
const first=$$('.nav-item')[cur];if(first)$('#navIndicator').style.transform=`translateY(${first.offsetTop}px)`;
requestAnimationFrame(loopCharacter);
startParticles();
toast('Welcome to Luxis',state.accounts.length+' accounts · '+state.profiles.length+' instances ready','✦','ok');
if(api())api().checkUpdate().then(raw=>{try{const r=JSON.parse(raw);if(r.available)toast('Update available','Luxis '+r.latest+' — open the Updates tab','↻','warn')}catch(e){}}).catch(()=>{});
