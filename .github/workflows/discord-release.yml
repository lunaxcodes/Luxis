name: Announce release on Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.1.1)'
        required: true
      url:
        description: 'Release URL'
        required: true
      title:
        description: 'Release title'
        required: true
      body:
        description: 'Release notes'
        required: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post release link to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_URL: ${{ github.event.release.html_url || inputs.url }}
          RELEASE_NAME: ${{ github.event.release.name || inputs.title }}
          BODY: ${{ github.event.release.body || inputs.body }}
        run: |
          payload=$(jq -n \
            --arg tag "$TAG" \
            --arg url "$RELEASE_URL" \
            --arg title "${RELEASE_NAME:-Luxis $TAG}" \
            --arg body "$BODY" \
            '{content: ("@everyone\n**" + $title + " — a big Luxis update is live.**\n\nYou can update right inside the launcher, no redownload needed. Open the Updates tab and click Download & install.\n\nFull changelog in the release notes below."), embeds: [{title: ("🚀 " + $title), url: $url, description: ($body[0:3500]), color: 13145214, footer: {text: "New Luxis release"}}]}')
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
