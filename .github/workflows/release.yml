name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup 6
        run: |
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile 'inno.exe'
          $p = Start-Process -FilePath 'inno.exe' -ArgumentList '/VERYSILENT /NORESTART /ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Inno Setup install failed' }

      - name: Build app, manifest and installer
        run: powershell -ExecutionPolicy Bypass -File .\build-release.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luxis-${{ github.ref_name }}
          path: |
            installer\*.exe
            release\*
            dist\mac-release\*

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          $tag = "v$v"
          $assets = @("installer/Luxis-Setup-$v.exe", "release/Luxis.exe", "release/version.json")
          Get-ChildItem 'dist/mac-release' -File | ForEach-Object { $assets += $_.FullName }
          $notes = @"
          ## Luxis v$v

          **Windows:** installer, portable exe, and auto-update manifest.

          **macOS:** Apple Silicon and Intel `.app.zip` bundles, plus per-architecture update manifests. Open with Right-click → Open on first launch if Gatekeeper warns.

          **In-game Luxis Mod v1.4.0** — 15 new PvP HUD readouts covering cooldowns, consumable stock, durability, health, latency, and target distance. Read-only; no automation or reach changes.

          **Motion update** — adjustable window width/height, Glide/Zoom/Fade transitions, configurable menu particles, 3D skin and cape viewer, and new performance/visual modules.

          Update in-app from the Updates tab; use the Luxis Mod tab to install the new mod jar.
          "@
          if (gh release view $tag -R lunaxcodes/Luxis >$null 2>&1) {
            gh release upload $tag @assets -R lunaxcodes/Luxis --clobber
          } else {
            gh release create $tag @assets -R lunaxcodes/Luxis --title "Luxis v$v" --notes $notes
          }
