name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup 6
        run: |
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile 'inno.exe'
          $p = Start-Process -FilePath 'inno.exe' -ArgumentList '/VERYSILENT /NORESTART /ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Inno Setup install failed' }

      - name: Build app, manifest and installer
        run: powershell -ExecutionPolicy Bypass -File .\build-release.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Luxis-${{ github.ref_name }}
          path: |
            installer\*.exe
            release\*
            dist\mac-release\*

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          $tag = "v$v"
          $assets = @("installer/Luxis-Setup-$v.exe", "release/Luxis.exe", "release/version.json",
                      "LuxisClientMod.jar", "LuxisClientMod-1.21x.jar")
          Get-ChildItem 'dist/mac-release' -File | ForEach-Object { $assets += $_.FullName }
          $notes = @"
          ## Luxis v$v

          **Reliable multi-instance play** — Play always launches the selected profile. Running games appear in the Instances tab with PID, uptime, live logs, and independent Stop controls. Games are tracked across launcher restarts and each profile keeps its own folder.

          **Drag & drop mods** — dropping .jar files onto a profile now opens the file picker for that profile. The Luxis Mod sidebar entry is highlighted so it is easy to find.

          **In-game Luxis Mod v1.5.1** — bundled for Minecraft 26.3 and 1.21.11:

          - Working Zoom (hold C by default, scroll to adjust), camera-only Freelook (hold V), and Fullbright
          - Hold or Toggle keybind mode on every module
          - Themed HUD panels with custom labels, text colors, opacity, and outlines
          - Full-menu themes, Color Grading, and 29 new modules across Visual, HUD, Performance, and PvP

          **Windows:** installer, portable exe, and auto-update manifest. **macOS:** Apple Silicon and Intel .app.zip bundles with per-architecture update manifests. Open with Right-click → Open on first launch if Gatekeeper warns.

          Update in-app from the Updates tab. Install the matching mod jar from the Luxis Mod tab.
          "@
          if (gh release view $tag -R lunaxcodes/Luxis >$null 2>&1) {
            gh release upload $tag @assets -R lunaxcodes/Luxis --clobber
          } else {
            gh release create $tag @assets -R lunaxcodes/Luxis --title "Luxis v$v" --notes $notes
          }
